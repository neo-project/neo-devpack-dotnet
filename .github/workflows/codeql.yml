name: CodeQL

on:
  push:
    branches: [master-n3]
  pull_request:
    branches: [master-n3]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.0.4xx

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.4
        with:
          languages: csharp

      - name: Build source projects
        run: |
          dotnet build src/Neo.Compiler.CSharp/Neo.Compiler.CSharp.csproj --no-incremental
          dotnet build src/Neo.SmartContract.Framework/Neo.SmartContract.Framework.csproj --no-incremental
          dotnet build src/Neo.SmartContract.Template/Neo.SmartContract.Template.csproj --no-incremental

      - name: Analyze
        uses: github/codeql-action/analyze@v4.39.4
